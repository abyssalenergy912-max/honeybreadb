name: Build Welkin Moon

on:
  workflow_dispatch:
  push:
    paths:
      - "WelkinMoon-Fabric-1.21.1-Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP_PATH=$(find . -type f \
            -name "WelkinMoon-Fabric-1.21.1-Source.zip" \
            -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "Welkin Moon ZIP not found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_PATH" -d extracted

          PROJECT_DIR=$(find extracted \
            -type f -name build.gradle \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/gradle.properties" ]; then
            echo "Gradle project not found in ZIP!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build Fabric mod
        run: gradle -p "$PROJECT_DIR" clean build --no-daemon

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: welkin-moon-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
